<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Número a Letras</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input type="number" label="Número (1 - 1000)" labelPlacement="floating"
      min="1" max="1000" [(ngModel)]="numero"></ion-input>
  </ion-item>
  <ion-button expand="block" class="ion-margin-top" (click)="traducir()">Traducir</ion-button>

  @if (error) { <p class="ion-text-center" style="color:red">{{ error }}</p> }
  @if (texto) { <h2 class="ion-text-center" style="text-transform: capitalize">{{ texto }}</h2> }
</ion-content>

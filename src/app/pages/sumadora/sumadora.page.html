<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Sumadora</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input type="number" label="Primer número" labelPlacement="floating" [(ngModel)]="num1"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input type="number" label="Segundo número" labelPlacement="floating" [(ngModel)]="num2"></ion-input>
  </ion-item>
  <ion-button expand="block" class="ion-margin-top" (click)="sumar()">Sumar</ion-button>

  @if (resultado !== null) {
    <h2 class="ion-text-center">Resultado: {{ resultado }}</h2>
  }
</ion-content>
